name: Releases

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version-file: "package.json"
      - name: Install
        run: bun install
      - name: Update
        run: bun run dist
      - name: Get Tag Name
        id: get_tag_name
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: "chronixd"
          body: |
            Usage of ${{ steps.get_tag_name.outputs.tag_name }}

            ```yaml
            name: Update
            on:
              schedule:
                - cron: "*/30 0-16,22-23 * * *"
              workflow_dispatch:
            env:
              CHRONIXD_VERSION: ${{steps.get_tag_name.outputs.tag_name}}

            permissions:
              contents: none
            jobs:
              update:
                runs-on: ubuntu-latest
                steps:
                  - name: Checkout data repo
                    uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
                    with:
                      repository: ${{secrets.DATA_REPOSITORY}}
                      token: ${{secrets.DATA_REPO_TOKEN}}
                      path: data-repo

                  - name: Restore cache
                    uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                    with:
                      path: .cache
                      key: chronixd-cache-${{github.run_id}}
                      restore-keys: chronixd-cache-

                  - name: Download chronixd
                    run: |
                      curl -L https://github.com/azu/chronixd/releases/download/${{env.CHRONIXD_VERSION}}/chronixd -o chronixd
                      chmod +x chronixd

                  - name: Run chronixd
                    run: CACHE_DIR=$(pwd)/.cache ./chronixd --output ./data-repo/db > /dev/null 2>&1
                    env:
                      CHRONIXD_ENVS: ${{secrets.CHRONIXD_ENVS}}

                  - name: Save cache
                    uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                    with:
                      path: .cache
                      key: chronixd-cache-${{github.run_id}}

                  - name: Commit and push
                    working-directory: data-repo
                    run: |
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git add db/ > /dev/null 2>&1
                      git diff --cached --quiet 2>/dev/null || git commit -m "chore: update db" > /dev/null 2>&1
                      git push > /dev/null 2>&1
            ```
