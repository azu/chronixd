name: Releases

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version-file: "package.json"
      - name: Install
        run: bun install
      - name: Update
        run: bun run dist
      - name: Generate release body
        id: release_body
        run: echo "body=See [README](https://github.com/azu/chronixd#via-github-actions) for usage." >> "$GITHUB_OUTPUT"
      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: "chronixd"
          body: ${{ steps.release_body.outputs.body }}
