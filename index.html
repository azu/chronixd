<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chronixd ENV Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { margin-bottom: 4px; }
        p.desc { color: #666; margin-top: 0; }
        .entry {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .entry-header select {
            width: auto;
            font-size: 14px;
            padding: 4px 8px;
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 13px;
        }
        .field-group input,
        .field-group select {
            width: 100%;
            padding: 6px 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .field-group { margin-bottom: 8px; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add { background: #0070f3; color: #fff; margin-bottom: 16px; }
        .btn-remove { background: #e00; color: #fff; font-size: 12px; padding: 4px 10px; flex-shrink: 0; }
        .btn-generate { background: #000; color: #fff; font-size: 16px; padding: 10px 24px; }
        textarea {
            width: 100%;
            min-height: 120px;
            font-family: monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .output { margin-top: 16px; }
        .hint { font-size: 12px; color: #888; margin-top: -6px; margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>chronixd ENV Generator</h1>
<p class="desc">Generate <code>CHRONIXD_ENVS</code> JSON for chronixd configuration.</p>

<div id="entries"></div>
<button class="btn-add" onclick="addEntry()">+ Add Service</button>
<br>
<button class="btn-generate" onclick="generate()">Generate</button>
<div class="output">
    <textarea id="result" readonly onclick="copyToClipboard()"></textarea>
    <p class="hint">Click textarea to copy</p>
</div>

<script>
const SERVICES = {
    bluesky: {
        label: "Bluesky",
        fields: [
            { key: "bluesky_identifier", label: "Identifier", placeholder: "user.bsky.social" },
            { key: "bluesky_app_password", label: "App Password", placeholder: "xxxx-xxxx-xxxx-xxxx", type: "password" },
        ]
    },
    github_events: {
        label: "GitHub Events",
        fields: [
            { key: "github_token", label: "GitHub Token", placeholder: "ghp_...", type: "password" },
            { key: "github_username", label: "Username", placeholder: "azu" },
        ]
    },
    github_search: {
        label: "GitHub Search",
        fields: [
            { key: "github_token", label: "GitHub Token", placeholder: "ghp_...", type: "password" },
            { key: "github_search_query", label: "Search Query", placeholder: 'involves:azu updated:>={{-1day}}' },
            { key: "github_search_type", label: "Search Type", options: ["ISSUE", "REPOSITORY"] },
        ]
    },
    linear: {
        label: "Linear",
        fields: [
            { key: "linear_token", label: "API Token", placeholder: "lin_api_...", type: "password" },
            { key: "linear_search_type", label: "Search Type", options: ["assigned_me", "created_by_me", "activity"] },
        ]
    },
    calendar: {
        label: "Calendar (iCal)",
        fields: [
            { key: "calendar_url", label: "iCal URL", placeholder: "https://calendar.google.com/calendar/ical/..." },
        ]
    },
    rss: {
        label: "RSS",
        fields: [
            { key: "rss_url", label: "Feed URL", placeholder: "https://example.com/feed.xml" },
        ]
    },
    location: {
        label: "Location",
        fields: [
            { key: "location_api_url", label: "API URL", placeholder: "https://example.com/api/locations" },
            { key: "location_api_token", label: "API Token", placeholder: "token", type: "password" },
            { key: "location_device_id", label: "Device ID (optional)", placeholder: "device-1", optional: true },
        ]
    },
    notion: {
        label: "Notion",
        fields: [
            { key: "notion_token", label: "Integration Token", placeholder: "ntn_...", type: "password" },
            { key: "notion_data_source_id", label: "Data Source ID", placeholder: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" },
        ]
    },
    slack: {
        label: "Slack Search",
        fields: [
            { key: "slack_token", label: "User Token", placeholder: "xoxp-...", type: "password" },
            { key: "slack_query", label: "Search Query", placeholder: "from:@me" },
        ]
    },
    asocial_bookmark: {
        label: "Bookmarks (asocial-bookmark)",
        fields: [
            { key: "asocial_bookmark_owner", label: "GitHub Owner", placeholder: "azu" },
            { key: "asocial_bookmark_repo", label: "Repository Name", placeholder: "mybookmarks" },
            { key: "asocial_bookmark_token", label: "GitHub Token", placeholder: "github_pat_...", type: "password" },
            { key: "asocial_bookmark_branch", label: "Branch", placeholder: "master" },
        ]
    },
};

let entryCount = 0;

function createFieldHTML(field, idx) {
    const id = `${field.key}___${idx}`;
    if (field.options) {
        const opts = field.options.map(o => `<option value="${o}">${o}</option>`).join("");
        return `<div class="field-group"><label for="${id}">${field.label}</label><select id="${id}">${opts}</select></div>`;
    }
    const type = field.type || "text";
    const req = field.optional ? "" : "required";
    return `<div class="field-group"><label for="${id}">${field.label}</label><input id="${id}" type="${type}" placeholder="${field.placeholder || ""}" ${req}></div>`;
}

function addEntry() {
    const idx = entryCount++;
    const div = document.createElement("div");
    div.className = "entry";
    div.id = `entry-${idx}`;

    const serviceOptions = Object.entries(SERVICES).map(([k, v]) =>
        `<option value="${k}">${v.label}</option>`
    ).join("");

    div.innerHTML = `
        <div class="entry-header">
            <select id="service-${idx}" onchange="updateFields(${idx})">${serviceOptions}</select>
            <button class="btn-remove" onclick="removeEntry(${idx})">Remove</button>
        </div>
        <div class="field-group">
            <label for="name-${idx}">name (required)</label>
            <input id="name-${idx}" type="text" placeholder="my-timeline" required>
        </div>
        <div id="fields-${idx}"></div>
    `;
    document.getElementById("entries").appendChild(div);
    updateFields(idx);
}

function updateFields(idx) {
    const serviceKey = document.getElementById(`service-${idx}`).value;
    const service = SERVICES[serviceKey];
    document.getElementById(`fields-${idx}`).innerHTML = service.fields.map(f => createFieldHTML(f, idx)).join("");
}

function removeEntry(idx) {
    const el = document.getElementById(`entry-${idx}`);
    if (el) el.remove();
}

function generate() {
    const entries = document.querySelectorAll(".entry");
    const result = [];
    for (const entry of entries) {
        const idx = entry.id.replace("entry-", "");
        const name = document.getElementById(`name-${idx}`).value.trim();
        if (!name) { alert("name is required"); return; }

        const serviceKey = document.getElementById(`service-${idx}`).value;
        const service = SERVICES[serviceKey];
        const obj = { name };

        for (const field of service.fields) {
            const el = document.getElementById(`${field.key}___${idx}`);
            const val = el.value.trim();
            if (!field.optional && !val) { alert(`${field.label} is required`); return; }
            if (val) obj[field.key] = val;
        }
        result.push(obj);
    }
    document.getElementById("result").value = `CHRONIXD_ENVS='${JSON.stringify(result)}'`;
}

function copyToClipboard() {
    const textarea = document.getElementById("result");
    if (!textarea.value) return;
    navigator.clipboard.writeText(textarea.value);
}

addEntry();
</script>
</body>
</html>
